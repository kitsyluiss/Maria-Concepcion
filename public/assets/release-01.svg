<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <radialGradient id="r1-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a081a"/>
      <stop offset="50%" stop-color="#14050e"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="r1-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="r1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="550" fill="url(#r1-bg)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,42,133,0.07)" stroke-width="1">
    <line x1="0" y1="110" x2="800" y2="110"/>
    <line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="160" y1="0" x2="160" y2="550"/>
    <line x1="320" y1="0" x2="320" y2="550"/>
    <line x1="480" y1="0" x2="480" y2="550"/>
    <line x1="640" y1="0" x2="640" y2="550"/>
  </g>

  <!-- Glowing Emblem / Sound Ring -->
  <g transform="translate(400, 240)">
    <circle r="150" fill="none" stroke="rgba(255,42,133,0.15)" stroke-width="2"/>
    <circle r="120" fill="none" stroke="url(#r1-accent)" stroke-width="3" stroke-dasharray="8 6" filter="url(#r1-glow)"/>
    <circle r="80" fill="none" stroke="rgba(243,241,234,0.3)" stroke-width="1.5"/>
    <polygon points="0,-60 52,30 -52,30" fill="none" stroke="#ff2a85" stroke-width="2.5" opacity="0.85"/>
    <circle r="12" fill="#ff2a85" filter="url(#r1-glow)"/>
  </g>

  <!-- Typographic Layout -->
  <text x="50" y="70" font-family="'Anton', sans-serif" font-size="16" letter-spacing="4" fill="#ff2a85">MARIA CONCEPCION</text>
  <text x="750" y="70" font-family="'Onest', sans-serif" font-size="14" letter-spacing="3" fill="#807f78" text-anchor="end">STUDIO ALBUM • 2024</text>
  
  <text x="50" y="470" font-family="'Anton', sans-serif" font-size="64" letter-spacing="2" fill="#f3f1ea" text-transform="uppercase">NEON REQUIEM</text>
  <text x="50" y="505" font-family="'Onest', sans-serif" font-size="13" letter-spacing="2" fill="#807f78">PLATINUM CERTIFIED • 155M STREAMS • 12 TRACKS • LOSSLESS MASTER</text>
  <text x="750" y="505" font-family="'Onest', sans-serif" font-size="13" letter-spacing="3" fill="#ff2a85" text-anchor="end">LP-003 // MC-REC</text>
</svg>