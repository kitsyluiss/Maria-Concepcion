<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <radialGradient id="r3-bg" cx="40%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#36081e"/>
      <stop offset="45%" stop-color="#18040d"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="r3-streak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff758c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0"/>
    </linearGradient>
    <filter id="r3-blur">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="550" fill="url(#r3-bg)"/>

  <!-- High-voltage Light Streaks -->
  <polygon points="100,50 700,450 620,490 20,90" fill="url(#r3-streak)" filter="url(#r3-blur)"/>
  <circle cx="380" cy="250" r="140" fill="none" stroke="#ff2a85" stroke-width="1.5" opacity="0.4"/>
  <circle cx="440" cy="270" r="90" fill="none" stroke="#ff65a3" stroke-width="2" stroke-dasharray="12 8" opacity="0.7"/>

  <!-- Metadata -->
  <text x="50" y="70" font-family="'Anton', sans-serif" font-size="16" letter-spacing="4" fill="#ff2a85">MARIA CONCEPCION</text>
  <text x="750" y="70" font-family="'Onest', sans-serif" font-size="14" letter-spacing="3" fill="#807f78" text-anchor="end">LEAD SINGLE • 2021</text>

  <text x="50" y="470" font-family="'Anton', sans-serif" font-size="70" letter-spacing="2" fill="#f3f1ea" text-transform="uppercase">AFTERGLOW</text>
  <text x="50" y="505" font-family="'Onest', sans-serif" font-size="13" letter-spacing="2" fill="#807f78">GLOBAL TOP 40 • 74M STREAMS • 128 BPM SUB-BASS ANTHEM</text>
  <text x="750" y="505" font-family="'Onest', sans-serif" font-size="13" letter-spacing="3" fill="#ff2a85" text-anchor="end">SG-004 // STEREO</text>
</svg>